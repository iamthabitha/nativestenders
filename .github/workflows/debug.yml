name: Debug search (manual)

on:
  workflow_dispatch:
    inputs:
      search_terms:
        description: "Comma-separated terms to search for (buyer name, bid number, etc.)"
        required: false
        default: "Metsimaholo,Sekhukhune,Richmond"
      lookback_days:
        description: "How many days back to search"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  debug-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run debug search
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          SEARCH_TERMS: ${{ inputs.search_terms }}
          DEBUG_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python debug_search.py
